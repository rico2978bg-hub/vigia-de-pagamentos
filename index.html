<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vigia de Pagamentos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: painel de operação — cabeçalho com resumo, gráfico diário largo, 4 alertas em grade 2×2 que vira coluna no celular. */
:root{
  --bg:#f4f6f8; --surface:#ffffff; --ink:#15202b; --muted:#5a6676; --line:#dde2e8; --accent:#1d5fa8;
  --ok:#1e7a45; --ok-bg:#e5f3ea; --warn:#946000; --warn-bg:#fcf1d8; --crit:#b42318; --crit-bg:#fce9e7;
  --band:rgba(180,35,24,.08); --muted-line:#8a96a6;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0e1318; --surface:#151c24; --ink:#e5eaf0; --muted:#9aa6b4; --line:#28323e; --accent:#6fa9ea;
    --ok:#4fc58b; --ok-bg:#11281c; --warn:#f0b64e; --warn-bg:#2c2311; --crit:#ff7d70; --crit-bg:#321614;
    --band:rgba(255,125,112,.10); --muted-line:#6b7685;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e1318; --surface:#151c24; --ink:#e5eaf0; --muted:#9aa6b4; --line:#28323e; --accent:#6fa9ea;
  --ok:#4fc58b; --ok-bg:#11281c; --warn:#f0b64e; --warn-bg:#2c2311; --crit:#ff7d70; --crit-bg:#321614;
  --band:rgba(255,125,112,.10); --muted-line:#6b7685;
}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
.wrap{max-width:1120px;margin:0 auto;padding-block:28px 48px;display:grid;gap:20px}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:1.75rem;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.05rem;font-weight:600}
h3{font-size:1.1rem;font-weight:600}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between}
.top p{margin:4px 0 0;color:var(--muted);font-size:.9rem}
.summary{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.8rem;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.s-ok{color:var(--ok);background:var(--ok-bg)}
.s-warn{color:var(--warn);background:var(--warn-bg)}
.s-crit{color:var(--crit);background:var(--crit-bg)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 18px 12px}
.panel-head{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:baseline;justify-content:space-between;margin-bottom:8px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.82rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:18px;height:0;border-top:2.5px solid var(--accent)}
.sw.dash{border-top:2px dashed var(--muted-line)}
.sw.band{height:10px;border:0;background:var(--band);outline:1px solid var(--crit-bg)}
#chart{position:relative;width:100%}
#chart svg{display:block;width:100%;height:auto}
#chart text{fill:var(--muted);font-family:var(--mono);font-size:11px}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.8rem;box-shadow:0 4px 14px rgba(0,0,0,.12);white-space:nowrap}
.tip b{display:block;margin-bottom:2px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,470px),1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:grid;gap:14px;align-content:start}
.card.crit{border-color:color-mix(in srgb,var(--crit) 45%,var(--line))}
.card.warn{border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
.card-head{display:flex;gap:12px;align-items:start;justify-content:space-between}
.proof{display:grid;gap:2px}
.big{font-family:var(--mono);font-size:2rem;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.crit .big{color:var(--crit)} .warn .big{color:var(--warn)} .ok .big{color:var(--ok)}
.sec{display:grid;gap:2px}
.lbl{font-size:.78rem;font-weight:600;color:var(--muted)}
.sec p,.proof p{margin:0;max-width:65ch}
table.mini{border-collapse:collapse;font-size:.85rem;width:100%}
table.mini th{text-align:left;font-weight:600;color:var(--muted);font-size:.78rem;padding:4px 8px 4px 0;border-bottom:1px solid var(--line)}
table.mini td{padding:5px 8px 5px 0;border-bottom:1px solid var(--line);vertical-align:top}
table.mini td.r,table.mini th.r{text-align:right}
.tbl{overflow-x:auto}
.ai{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:10px}
.ai-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font:inherit;font-size:.88rem;font-weight:600;border-radius:8px;padding:7px 14px;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:var(--surface)}
button.ghost{background:transparent;color:var(--accent)}
button:disabled{opacity:.55;cursor:default}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ai-out{white-space:pre-wrap;background:var(--bg);border-radius:8px;padding:12px 14px;max-width:none}
.ai-out:empty{display:none}
.note{font-size:.82rem;color:var(--muted)}
footer{font-size:.8rem;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){button{transition:filter .15s}button:hover:not(:disabled){filter:brightness(1.08)}}
</style>

<div class="wrap">
  <header class="top" id="topo">
    <div>
      <h1>Vigia de Pagamentos</h1>
      <p id="fonte">Carregando dados…</p>
    </div>
    <div class="summary" id="resumo" aria-label="Resumo dos alertas"></div>
  </header>

  <section class="panel" id="grafico-aprovacao" aria-labelledby="g-title">
    <div class="panel-head">
      <h2 id="g-title">Taxa de aprovação de cartão por dia</h2>
      <div class="legend">
        <span><i class="sw"></i>Todas as transações</span>
        <span><i class="sw dash"></i>Sem o ataque</span>
        <span><i class="sw band"></i>Dias do ataque</span>
      </div>
    </div>
    <div id="chart" role="img" aria-label="Gráfico de linha da taxa de aprovação diária"></div>
  </section>

  <section class="cards" id="alertas" aria-label="Alertas"></section>

  <footer id="rodape"></footer>
</div>

  const C=Object.fromEntries(D.cols.map((c,i)=>[c,i]));
  const H=3600e3, DAY=24*H;
  const rows=D.rows.map(r=>{const s=r[C.criado_em];const t=Date.parse(s.replace(" ","T")+"Z");return{
    t, day:s.slice(0,10), di:Math.floor(t/DAY), hour:+s.slice(11,13), pedido:r[C.pedido_id], m:r[C.merchant_id],
    b:r[C.bandeira], a:r[C.adquirente], v:r[C.valor], tent:r[C.tentativa], ok:r[C.status]==="aprovada",
    cod:r[C.codigo_recusa], dev:r[C.device_id], cb:r[C.chargeback]===1, cbm:r[C.motivo_chargeback]}});
  const group=(xs,f)=>{const m=new Map();for(const x of xs){const k=f(x);(m.get(k)||m.set(k,[]).get(k)).push(x)}return m};
  const rate=xs=>xs.length?xs.filter(x=>x.ok).length/xs.length:NaN;
  const mode=xs=>{const c=new Map();for(const x of xs)c.set(x,(c.get(x)||0)+1);let best=null,n=0;for(const[k,v]of c)if(v>n){best=k;n=v}return{value:best,count:n}};
  const avg=xs=>xs.reduce((s,x)=>s+x,0)/(xs.length||1);
  const maxPerHour=ts=>{ts=[...ts].sort((a,b)=>a-b);let j=0,mx=0;for(let i=0;i<ts.length;i++){while(ts[i]-ts[j]>=H)j++;mx=Math.max(mx,i-j+1)}return mx};

  // Dias com volume real (descarta pontas com poucas transações).
  const perDay=group(rows,r=>r.di);
  const valid=[...perDay.keys()].filter(d=>perDay.get(d).length>=20).sort((a,b)=>a-b);
  const dMin=valid[0], dMax=valid.at(-1);
  const dayStr=di=>new Date(di*DAY).toISOString().slice(0,10);

  // ---- Alerta 2: ataque de teste de cartão (aparelho com ≥10 compras em 1h) ----
  const BURST=10;
  const devStats=[...group(rows,r=>r.dev)].map(([dev,rs])=>({dev,rs,max:maxPerHour(rs.map(r=>r.t))}));
  const bad=devStats.filter(d=>d.max>=BURST);
  const badSet=new Set(bad.map(d=>d.dev));
  const atk=rows.filter(r=>badSet.has(r.dev));
  const clean=rows.filter(r=>!badSet.has(r.dev));
  const normalMax=Math.max(0,...devStats.filter(d=>d.max<BURST).map(d=>d.max));
  let attack;
  if(!atk.length){
    attack={id:"ataque",sev:"ok",title:"Ataque de teste de cartão",summary:"Nenhum aparelho com compras em rajada.",days:[]};
  }else{
    const ts=atk.map(r=>r.t).sort((a,b)=>a-b);
    const val=mode(atk.map(r=>r.v)), mer=mode(atk.map(r=>r.m));
    const atkDays=[...new Set(atk.map(r=>r.di))].sort((a,b)=>a-b);
    const onDays=rows.filter(r=>atkDays.includes(r.di));
    attack={id:"ataque",sev:"crit",title:"Ataque de teste de cartão",
      devices:bad.map(d=>d.dev).sort(), n:atk.length, ap:atk.filter(r=>r.ok).length, cb:atk.filter(r=>r.cb).length,
      first:ts[0], last:ts.at(-1), hmin:Math.min(...atk.map(r=>r.hour)), hmax:Math.max(...atk.map(r=>r.hour)),
      valor:val.value, valorShare:val.count/atk.length, merchant:mer.value, merchantShare:mer.count/atk.length,
      maxHour:Math.max(...bad.map(d=>d.max)), normalMax,
      rateDaysAll:rate(onDays), rateDaysClean:rate(onDays.filter(r=>!badSet.has(r.dev))), days:atkDays.map(dayStr)};
  }

  // ---- Série diária ----
  const series=valid.map(d=>{const all=perDay.get(d);const cl=all.filter(r=>!badSet.has(r.dev));
    return{day:dayStr(d),di:d,n:all.length,rate:rate(all),rateClean:rate(cl),nAtk:all.length-cl.length}});

  // ---- Alerta 1: queda por adquirente + bandeira, semana vs semana anterior (sem o ataque) ----
  const MINW=50; // semanas com menos transações que isso são ruído
  const pairs=[...group(clean,r=>r.a+"|"+r.b)].map(([k,rs])=>{
    const n=new Map(),ok=new Map();
    for(const r of rs){n.set(r.di,(n.get(r.di)||0)+1);if(r.ok)ok.set(r.di,(ok.get(r.di)||0)+1)}
    const win=(a,b)=>{let N=0,O=0;for(let d=a;d<=b;d++){N+=n.get(d)||0;O+=ok.get(d)||0}return{n:N,ok:O,rate:N?O/N:NaN}};
    let worst=null;
    for(let d=dMin+13;d<=dMax;d++){
      const cur=win(d-6,d), prev=win(d-13,d-7);
      if(cur.n<MINW||prev.n<MINW)continue;
      const drop=prev.rate-cur.rate;
      if(!worst||drop>worst.drop)worst={end:d,drop,cur,prev};
    }
    const [a,b]=k.split("|");
    return{a,b,rs,worst,win,last:win(dMax-6,dMax)};
  }).filter(p=>p.worst);
  pairs.sort((x,y)=>y.worst.drop-x.worst.drop);
  let queda;
  const top=pairs[0];
  if(!top||top.worst.drop<0.05){
    queda={id:"queda",sev:"ok",title:"Queda de aprovação por adquirente + bandeira",summary:"Nenhuma combinação caiu 5 pontos ou mais de uma semana para outra."};
  }else{
    const w=top.worst, start=w.end-6;
    const after=top.rs.filter(r=>r.di>=start&&r.di<=dMax);
    const lost=Math.max(0,after.length*w.prev.rate-after.filter(r=>r.ok).length);
    const ticket=avg(after.map(r=>r.v));
    const sameBrand=pairs.filter(p=>p.b===top.b&&p.a!==top.a).map(p=>{const c=p.win(start,w.end),pv=p.win(start-7,w.end-7);return{a:p.a,prev:pv.rate,cur:c.rate}});
    const declines=after.filter(r=>!r.ok&&r.cod);
    const code=mode(declines.map(r=>r.cod));
    queda={id:"queda",sev:w.drop>=0.15?"crit":"warn",title:"Queda de aprovação por adquirente + bandeira",
      a:top.a,b:top.b,weekStart:dayStr(start),weekEnd:dayStr(w.end),prev:w.prev,cur:w.cur,drop:w.drop,last:top.last,
      lastStart:dayStr(dMax-6),lastEnd:dayStr(dMax),lost,lostBRL:lost*ticket,sameBrand,
      topCode:code.value,topCodeShare:declines.length?code.count/declines.length:0};
  }

  // ---- Alerta 3: retentativa errada (código 51 retentado em menos de 1h) ----
  const tries=[];
  for(const rs of group(clean,r=>r.pedido).values()){
    const t1=rs.find(r=>r.tent===1), t2=rs.find(r=>r.tent===2);
    if(t1&&t2&&!t1.ok)tries.push({cod:t1.cod,gapH:(t2.t-t1.t)/H,ok:t2.ok,v:t2.v});
  }
  const bucket=(cod,f)=>{const xs=tries.filter(x=>x.cod===cod&&f(x.gapH));return{n:xs.length,ap:xs.filter(x=>x.ok).length,rate:rate(xs),v:avg(xs.map(x=>x.v))}};
  const f51=bucket("51",g=>g<1), s51=bucket("51",g=>g>=24), f05=bucket("05",g=>g<1), s05=bucket("05",g=>g>=24);
  const all51=tries.filter(x=>x.cod==="51").length;
  let retry;
  if(!f51.n){
    retry={id:"retentativa",sev:"ok",title:"Retentativa errada",summary:"Nenhuma recusa por saldo insuficiente foi retentada em menos de 1 hora.",f51,s51,f05,s05,all51,total:tries.length};
  }else{
    const gain=s51.n>=10?Math.max(0,f51.n*(s51.rate-f51.rate)):0;
    retry={id:"retentativa",sev:(s51.n>=10&&s51.rate-f51.rate>=0.15&&f51.n>=20)?"crit":"warn",title:"Retentativa errada",
      f51,s51,f05,s05,all51,total:tries.length,gain,gainBRL:gain*f51.v};
  }

  // ---- Alerta 4: loja com chargeback acima de 1% (sem o ataque) ----
  const approved=clean.filter(r=>r.ok);
  const globalCB=approved.filter(r=>r.cb).length/(approved.length||1);
  const merchants=[...group(approved,r=>r.m)].map(([m,rs])=>{const cbs=rs.filter(r=>r.cb);
    const motives={};for(const r of cbs)motives[r.cbm]=(motives[r.cbm]||0)+1;
    return{m,n:rs.length,cb:cbs.length,rate:cbs.length/rs.length,motives,valor:cbs.reduce((s,r)=>s+r.v,0)}});
  const flagged=merchants.filter(x=>x.rate>0.01).sort((a,b)=>b.rate-a.rate);
  let cb;
  if(!flagged.length){
    cb={id:"chargeback",sev:"ok",title:"Loja com chargeback acima de 1%",summary:"Todas as lojas estão abaixo de 1%.",globalCB};
  }else{
    const w=flagged[0], mm=Object.entries(w.motives).sort((a,b)=>b[1]-a[1]);
    const oper=mm[0][0]==="produto nao recebido";
    cb={id:"chargeback",sev:w.rate>=0.02?"crit":"warn",title:"Loja com chargeback acima de 1%",
      flagged,worst:w,motives:mm,operational:oper,globalCB,expected:globalCB*w.n,
      totalCB:flagged.reduce((s,x)=>s+x.cb,0),totalBRL:flagged.reduce((s,x)=>s+x.valor,0),nMerchants:merchants.length};
  }

  return{rows:rows.length,firstDay:dayStr(dMin),lastDay:dayStr(dMax),series,attack,queda,retry,cb};
}
</script>

<script>
(function(){
  const $=s=>document.querySelector(s);
  const pct=(x,d=1)=>Number.isFinite(x)?(x*100).toFixed(d).replace(".",",")+"%":"—";
  const pp=x=>(x>0?"−":"+")+Math.abs(x*100).toFixed(1).replace(".",",")+" pp";
  const int=x=>Math.round(x).toLocaleString("pt-BR");
  const brl=x=>x.toLocaleString("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0});
  const brl2=x=>x.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
  const dm=s=>s.slice(8,10)+"/"+s.slice(5,7);
  const dmT=t=>{const d=new Date(t);return String(d.getUTCDate()).padStart(2,"0")+"/"+String(d.getUTCMonth()+1).padStart(2,"0")+" às "+String(d.getUTCHours()).padStart(2,"0")+"h"+String(d.getUTCMinutes()).padStart(2,"0")};
  const MOT={"produto nao recebido":"produto não recebido","nao reconhece a compra":"não reconhece a compra","fraude":"fraude"};
  const COD={"05":"não autorizada","51":"saldo insuficiente","57":"transação não permitida","59":"suspeita de fraude","14":"cartão inválido"};
  const SEV={ok:["s-ok","OK"],warn:["s-warn","Atenção"],crit:["s-crit","Crítico"]};
  const el=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e};

  const A=analyze(JSON.parse($("#dados").textContent));

  $("#fonte").textContent=`transacoes.csv · ${int(A.rows)} transações de cartão · ${dm(A.firstDay)} a ${dm(A.lastDay)}/${A.lastDay.slice(0,4)}`;
  $("#rodape").textContent="Os alertas são calculados nesta página a partir do CSV. Queda semanal, retentativas e chargeback desconsideram os aparelhos marcados como ataque. Impactos são estimativas por quantidade de transações e ticket médio.";

  // ---------- Textos de cada card ----------
  function cardText(k){
    if(k.sev==="ok")return{what:k.summary,big:"OK",proof:"Nada fora do normal nos dados.",impact:"Nenhum.",action:"Seguir monitorando."};
    if(k.id==="queda"){
      const brand=k.b[0].toUpperCase()+k.b.slice(1), pair=`${k.a} + ${brand}`;
      const same=k.sameBrand.map(s=>`${s.a}: ${pct(s.prev,0)} → ${pct(s.cur,0)}`).join("; ");
      return{headline:pair,
        what:`A aprovação de ${pair} caiu de ${pct(k.prev.rate)} para ${pct(k.cur.rate)} na semana de ${dm(k.weekStart)} a ${dm(k.weekEnd)}, comparada com a semana anterior. Na última semana dos dados (${dm(k.lastStart)} a ${dm(k.lastEnd)}) continua em ${pct(k.last.rate)}.`,
        big:pp(k.drop),
        proof:`${int(k.prev.ok)} de ${int(k.prev.n)} aprovadas na semana anterior, contra ${int(k.cur.ok)} de ${int(k.cur.n)}. ${brand} nos outros adquirentes, mesma semana: ${same || "sem dados"}.`,
        impact:`Desde ${dm(k.weekStart)}, cerca de ${int(k.lost)} vendas a menos (≈ ${brl(k.lostBRL)}) em relação ao ritmo da semana anterior.`,
        action:`Abrir chamado com a ${k.a} sobre ${brand}, levando os códigos de recusa: ${pct(k.topCodeShare,0)} das recusas são código ${k.topCode} (${COD[k.topCode]||"outro"}). Enquanto não resolver, mandar ${brand} para outro adquirente.`};
    }
    if(k.id==="ataque"){
      const devs=k.devices.join(", ");
      return{headline:`${int(k.n)} compras de ${brl2(k.valor)}`,
        what:`Entre ${dmT(k.first)} e ${dmT(k.last)}, ${k.devices.length} aparelhos fizeram ${int(k.n)} compras na loja ${k.merchant}, ${k.valorShare>0.9?"todas":"quase todas"} de ${brl2(k.valor)} e sempre de madrugada (entre ${k.hmin}h e ${k.hmax+1}h). É o jeito de quem testa cartões roubados: compras pequenas, em sequência, para descobrir quais funcionam.`,
        big:`${int(k.maxHour)} por hora`,
        proof:`Um mesmo aparelho chegou a ${int(k.maxHour)} compras em uma hora. O cliente normal mais ativo fez ${int(k.normalMax)}.`,
        impact:`${int(k.ap)} cartões passaram e ${int(k.cb)} já viraram chargeback por fraude. Nos dias do ataque, a aprovação de cartão caiu para ${pct(k.rateDaysAll)} (seria ${pct(k.rateDaysClean)} sem ele).`,
        action:`Bloquear os aparelhos ${devs}. Limitar compras por aparelho (por exemplo, no máximo 5 por hora). Avisar a loja ${k.merchant} e revisar as ${int(k.ap)} compras aprovadas antes que gerem mais chargebacks.`};
    }
    if(k.id==="retentativa"){
      const g=k.s51.n>=10?`Esperar 24h teria rendido cerca de ${int(k.gain)} vendas a mais (≈ ${brl(k.gainBRL)}) no período.`:"Ainda há poucos casos de espera de 24h para estimar o ganho.";
      return{headline:"Saldo insuficiente retentado cedo",
        what:`Quando o cartão é recusado por saldo insuficiente (código 51), a nova tentativa está sendo feita em menos de 1 hora em ${int(k.f51.n)} de ${int(k.all51)} casos. O cliente ainda não tem saldo, então quase sempre falha de novo.`,
        big:pct(k.f51.rate),
        proof:`Aprovação da 2ª tentativa em menos de 1h (${int(k.f51.ap)} de ${int(k.f51.n)}). Quando se espera 24h ou mais, aprova ${pct(k.s51.rate)} (${int(k.s51.ap)} de ${int(k.s51.n)}).`,
        impact:g,
        action:`Código 51: esperar 24h ou mais antes de tentar de novo. Código 05 (não autorizada) é o contrário: tentar logo funciona melhor (${pct(k.f05.rate)} em menos de 1h, ${pct(k.s05.rate)} depois de 24h). Não insistir em recusas por fraude, cartão inválido ou transação não permitida.`};
    }
    if(k.id==="chargeback"){
      const w=k.worst, mot=k.motives.map(([m,n])=>`${n}× ${MOT[m]||m}`).join(", ");
      const kind=k.operational?"Isso aponta para problema de entrega da loja, e não para fraude: o cliente comprou de verdade e não recebeu.":"Isso aponta para fraude: o dono do cartão diz que não fez a compra.";
      return{headline:w.m,
        what:`${k.flagged.length} ${k.flagged.length>1?"lojas estão":"loja está"} com chargeback acima de 1% das compras aprovadas no cartão; a média das ${k.nMerchants} lojas é ${pct(k.globalCB,2)}. A pior é a ${w.m}, com motivos: ${mot}. ${kind}`,
        big:pct(w.rate),
        proof:`${int(w.cb)} chargebacks em ${int(w.n)} compras aprovadas na ${w.m}. Pela média, o esperado seria ${w.cb>=1?k.expected.toFixed(1).replace(".",","):"0"}.`,
        impact:`${int(k.totalCB)} chargebacks nas lojas acima de 1%, ≈ ${brl(k.totalBRL)} devolvidos aos clientes, fora as tarifas. Lojas com taxa alta entram nos programas de monitoramento das bandeiras, que cobram multa.`,
        action:k.operational?`Falar com a ${w.m}: pedir comprovantes de entrega e o prazo real de envio. Endurecer o antifraude não resolve, porque os clientes são legítimos.`:`Revisar as regras de antifraude da ${w.m} e exigir autenticação (3DS) nas compras de maior risco.`,
        table:k.flagged};
    }
  }

  // ---------- Cards ----------
  const order=[A.queda,A.attack,A.retry,A.cb];
  const counts={crit:0,warn:0,ok:0};order.forEach(k=>counts[k.sev]++);
  const res=$("#resumo");
  for(const s of ["crit","warn","ok"])if(counts[s])res.append(el("span","pill "+SEV[s][0],`${counts[s]} ${s==="crit"?"crítico":s==="warn"?"atenção":"ok"}${counts[s]>1&&s==="crit"?"s":""}`));

  const aiButtons=[];
  for(const k of order){
    const T=cardText(k);k._text=T;
    const c=el("article","card "+k.sev);c.id="alerta-"+k.id;
    const head=el("div","card-head");
    const hw=el("div");hw.append(el("h3",null,k.title));
    if(T.headline)hw.append(el("div","note",T.headline));
    head.append(hw,el("span","pill "+SEV[k.sev][0],SEV[k.sev][1]));
    c.append(head);
    const sec=(label,text)=>{const s=el("div","sec");s.append(el("div","lbl",label),el("p",null,text));return s};
    c.append(sec("O que está acontecendo",T.what));
    const pr=el("div","proof");pr.append(el("div","lbl","O número que prova"),el("div","big",T.big),el("p",null,T.proof));c.append(pr);
    if(T.table){
      const wrap=el("div","tbl"),t=el("table","mini");
      const hr=el("tr");["Loja","Chargebacks","Taxa","Motivos"].forEach((h,i)=>hr.append(el("th",i&&i<3?"r":null,h)));
      const th=el("thead");th.append(hr);t.append(th);const tb=el("tbody");
      for(const f of T.table){const tr=el("tr");
        tr.append(el("td",null,f.m),el("td","r num",`${f.cb} / ${f.n}`),el("td","r num",pct(f.rate,2)),
          el("td",null,Object.entries(f.motives).map(([m,n])=>`${n}× ${MOT[m]||m}`).join(", ")+(f.cb<3?" (poucos casos)":"")));
        tb.append(tr)}
      t.append(tb);wrap.append(t);c.append(wrap);
    }
    c.append(sec("Impacto estimado",T.impact),sec("Ação recomendada",T.action));
    const ai=el("div","ai"),row=el("div","ai-row"),btn=el("button",null,"Explicar com IA"),stop=el("button","ghost","Parar");
    btn.type="button";stop.type="button";stop.hidden=true;btn.hidden=true;
    const note=el("span","note",""),out=el("div","ai-out");out.setAttribute("aria-live","polite");
    row.append(btn,stop,note);ai.append(row,out);c.append(ai);
    aiButtons.push({k,btn,stop,note,out});
    $("#alertas").append(c);
  }

  // ---------- Explicar com IA ----------
  const ERR={rate_limited:"Muitos pedidos seguidos. Tente de novo em instantes.",session_expired:"Sua sessão expirou. Entre de novo no Claude.",refused:"A IA não respondeu a este pedido.",upstream_error:"A conexão falhou. Tente de novo."};
  function prompt(k){const T=k._text;return [
    "Você é analista de pagamentos de uma orquestradora e vai explicar um alerta para um diretor que não é técnico.",
    "Escreva em português do Brasil, em texto corrido sem markdown, sem títulos e sem listas, com no máximo 130 palavras em 3 parágrafos curtos:",
    "1) o que está acontecendo, em linguagem de negócio; 2) quanto isso custa ou arrisca; 3) qual decisão o diretor precisa tomar agora.",
    "Use só os números abaixo; não invente dados.","",
    `Alerta: ${k.title} (gravidade: ${SEV[k.sev][1]})`,`O que está acontecendo: ${T.what}`,`Número que prova: ${T.big}. ${T.proof}`,
    `Impacto estimado: ${T.impact}`,`Ação recomendada: ${T.action}`].join("\n")}
  let hidden=false;
  const hideAll=msg=>{hidden=true;aiButtons.forEach(b=>{b.btn.hidden=true;b.stop.hidden=true;b.note.textContent=msg})};
  (async()=>{
    const sample=await window.claude?.use?.("sample");
    if(!sample){hideAll("A explicação com IA aparece quando a página é aberta no Claude.");return}
    for(const b of aiButtons){
      b.btn.hidden=false;let ctl=null;
      b.stop.onclick=()=>ctl?.abort();
      b.btn.onclick=async()=>{
        if(hidden)return;
        ctl=new AbortController();b.btn.disabled=true;b.stop.hidden=false;b.note.textContent="Pensando…";b.out.textContent="";
        try{
          const {truncated}=await sample(prompt(b.k),{signal:ctl.signal,onText:({text})=>{b.note.textContent="";b.out.textContent=text}});
          b.note.textContent=truncated?"A resposta veio cortada.":"";b.btn.textContent="Explicar de novo";
        }catch(e){
          b.out.textContent=e.text??"";
          if(["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(e.code)){hideAll("A explicação com IA não está liberada nesta visualização.");return}
          b.note.textContent=e.code==="cancelled"?"":(ERR[e.code]||ERR.upstream_error);
        }finally{b.btn.disabled=false;b.stop.hidden=true}
      };
    }
  })();

  // ---------- Gráfico ----------
  const S=A.series, atkDays=new Set(A.attack.days||[]);
  function draw(){
    const box=$("#chart"),W=Math.max(300,box.clientWidth),Hh=W<520?220:280,m={l:40,r:14,t:12,b:26};
    const iw=W-m.l-m.r,ih=Hh-m.t-m.b,n=S.length,step=iw/(n-1);
    const x=i=>m.l+i*step,y=v=>m.t+(1-v)*ih;
    let g="";
    for(const v of [0,.25,.5,.75,1])g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${m.l-6}" y="${y(v)+4}" text-anchor="end">${v*100}%</text>`;
    S.forEach((d,i)=>{if(atkDays.has(d.day))g+=`<rect x="${x(i)-step/2}" y="${m.t}" width="${step}" height="${ih}" fill="var(--band)"/>`});
    const every=W<520?14:7;
    S.forEach((d,i)=>{if(i%every===0)g+=`<text x="${x(i)}" y="${Hh-8}" text-anchor="middle">${dm(d.day)}</text>`});
    const path=k=>S.map((d,i)=>(i?"L":"M")+x(i).toFixed(1)+","+y(d[k]).toFixed(1)).join("");
    g+=`<path d="${path("rateClean")}" fill="none" stroke="var(--muted-line)" stroke-width="1.6" stroke-dasharray="4 4"/>`;
    g+=`<path d="${path("rate")}" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round"/>`;
    const L=n-1;g+=`<circle cx="${x(L)}" cy="${y(S[L].rate)}" r="4" fill="var(--accent)"/>`;
    g+=`<line id="hl" x1="0" x2="0" y1="${m.t}" y2="${m.t+ih}" stroke="var(--muted)" stroke-width="1" visibility="hidden"/><circle id="hd" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2" visibility="hidden"/>`;
    g+=`<rect id="hit" x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent"/>`;
    box.innerHTML=`<svg viewBox="0 0 ${W} ${Hh}" width="${W}" height="${Hh}">${g}</svg><div class="tip" hidden></div>`;
    const tip=box.querySelector(".tip"),hl=box.querySelector("#hl"),hd=box.querySelector("#hd"),svg=box.querySelector("svg");
    const show=ev=>{
      const r=svg.getBoundingClientRect(),px=(ev.clientX-r.left)*W/r.width;
      const i=Math.max(0,Math.min(n-1,Math.round((px-m.l)/step))),d=S[i];
      hl.setAttribute("x1",x(i));hl.setAttribute("x2",x(i));hl.setAttribute("visibility","visible");
      hd.setAttribute("cx",x(i));hd.setAttribute("cy",y(d.rate));hd.setAttribute("visibility","visible");
      tip.hidden=false;tip.textContent="";
      tip.append(el("b",null,dm(d.day)+(d.nAtk?" · ataque":"")),el("div","num",`Aprovação: ${pct(d.rate)}`),el("div","num",`Sem o ataque: ${pct(d.rateClean)}`),el("div","num",`${int(d.n)} transações`));
      const tx=x(i)*r.width/W,tw=tip.offsetWidth;
      tip.style.left=Math.max(0,Math.min(r.width-tw,tx-tw/2))+"px";tip.style.top="0px";
    };
    const hide=()=>{tip.hidden=true;hl.setAttribute("visibility","hidden");hd.setAttribute("visibility","hidden")};
    const hit=box.querySelector("#hit");hit.addEventListener("pointermove",show);hit.addEventListener("pointerleave",hide);
  }
  draw();
  let rt,lastW=$("#chart").clientWidth;
  new ResizeObserver(()=>{const w=$("#chart").clientWidth;if(w===lastW)return;lastW=w;clearTimeout(rt);rt=setTimeout(draw,80)}).observe($("#chart"));
})();
</script>
